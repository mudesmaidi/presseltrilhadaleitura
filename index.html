<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falar no WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #BFE6F7;
    --sky-bottom: #8FCBE8;
    --paper: #FFFBF2;
    --ink: #223A57;
    --ink-soft: #5B7089;
    --coral: #FF6B4A;
    --coral-dark: #E85535;
    --sun: #FFD166;
    --leaf: #4CAF7D;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Nunito', -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--sky-top), var(--sky-bottom) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    position: relative;
    overflow-x: hidden;
  }
  /* nuvens decorativas */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.55;
    filter: blur(0.5px);
  }
  .cloud.c1 { width: 140px; height: 50px; top: 8%; left: -30px; }
  .cloud.c2 { width: 100px; height: 38px; top: 16%; right: -20px; }
  .cloud.c3 { width: 90px; height: 34px; bottom: 10%; left: 6%; }

  .card {
    position: relative;
    background: var(--paper);
    border-radius: 28px;
    padding: 38px 30px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(34, 58, 87, 0.22);
  }

  .illustration { width: 96px; height: 96px; margin: 0 auto 18px; display: block; }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 23px;
    color: var(--ink);
    margin: 0 0 12px;
    line-height: 1.35;
  }

  p.sub {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 26px;
    line-height: 1.6;
    max-width: 34ch;
    margin-left: auto;
    margin-right: auto;
  }

  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--coral);
    color: #fff;
    text-decoration: none;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 16px 22px;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(255, 107, 74, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  a.btn:active { transform: scale(0.97); background: var(--coral-dark); box-shadow: 0 6px 14px rgba(255,107,74,0.35); }
  a.btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  .timer-row {
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .timer-row .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--leaf);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  .trust {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #EFE9D8;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(ellipse at 50% -10%, #2A4A63, #16324A 70%); }
    .card { background: #22364A; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
    h1 { color: #F5F2E8; }
    p.sub, .trust, .timer-row { color: #B7C6D6; }
    .trust { border-top-color: #33465C; }
    .cloud { opacity: 0.15; }
  }
</style>
</head>
<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="card">
    <svg class="illustration" viewBox="0 0 100 100" fill="none">
      <path d="M50 30 C42 22 25 22 18 28 V66 C25 60 42 60 50 68 C58 60 75 60 82 66 V28 C75 22 58 22 50 30Z" fill="#FFFFFF" stroke="#223A57" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 30V68" stroke="#223A57" stroke-width="2.5"/>
      <path d="M24 34c4-2 12-2 18 2M24 44c4-2 12-2 18 2M24 54c4-2 12-2 18 2" stroke="#FF6B4A" stroke-width="2" stroke-linecap="round"/>
      <path d="M76 34c-4-2-12-2-18 2M76 44c-4-2-12-2-18 2M76 54c-4-2-12-2-18 2" stroke="#FF6B4A" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 12c1.5 4 5 5.5 9 5.5-4 1-6.5 4-8 8-1.5-4-4-7-8-8 4 0 6.5-1.5 7-5.5Z" fill="#FFD166"/>
    </svg>

    <h1>Ajude seu filho a dar os primeiros passos na leitura</h1>
    <p class="sub">Toque no botão e fale comigo no WhatsApp para conhecer o material completo, passo a passo, para o seu filho.</p>

    <a class="btn" id="waBtn" href="#">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.03 2 11c0 1.85.6 3.57 1.63 5L2 22l6.2-1.62A10.7 10.7 0 0 0 12 20c5.52 0 10-4.03 10-9S17.52 2 12 2Z"/></svg>
      Quero falar agora
    </a>

    <div class="timer-row">
      <span class="dot"></span>
      <span id="timerText">Redirecionando em 5s...</span>
    </div>

    <div class="trust">Mais de 2 mil famílias já receberam este material</div>
  </div>

<script>
  // ===================== CONFIGURAÇÃO =====================
  var WHATSAPP_NUMERO = "5516995206314";
  var MENSAGEM = "Olá! Vi o anúncio e quero saber mais sobre os recursos de leitura para meu filho.";
  var PIXEL_ID = "1100829495696193"; // ex: "1234567890123456"
  var AUTO_REDIRECT_SEGUNDOS = 0; // 0 desativa o redirecionamento automático
  // ==========================================================

  var link = "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(MENSAGEM);
  var btn = document.getElementById("waBtn");
  btn.href = link;

  if (PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PIXEL_ID);
    fbq('track', 'PageView');
  }

  function fireContact() {
    if (PIXEL_ID && window.fbq) fbq('track', 'Contact');
  }

  btn.addEventListener("click", fireContact);

  var timerEl = document.getElementById("timerText");
  if (AUTO_REDIRECT_SEGUNDOS > 0) {
    var remaining = AUTO_REDIRECT_SEGUNDOS;
    timerEl.textContent = "Redirecionando em " + remaining + "s...";
    var interval = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(interval);
        timerEl.textContent = "Abrindo o WhatsApp...";
        fireContact();
        window.location.href = link;
      } else {
        timerEl.textContent = "Redirecionando em " + remaining + "s...";
      }
    }, 1000);
  } else {
    timerEl.parentElement.style.display = "none";
  }
</script>
</body>
</html>
